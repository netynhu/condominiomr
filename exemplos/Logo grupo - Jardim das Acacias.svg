<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#14A587"/>
      <stop offset="0.55" stop-color="#0B6E59"/>
      <stop offset="1" stop-color="#073F35"/>
    </radialGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E3"/>
      <stop offset="1" stop-color="#E4D9C0"/>
    </linearGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CE5A"/>
      <stop offset="1" stop-color="#E0A92E"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <circle cx="512" cy="430" r="300" fill="#ffffff" opacity="0.06"/>

  <!-- torres: Bloco A e Bloco B -->
  <g>
    <rect x="452" y="210" width="150" height="400" rx="10" fill="url(#torre)"/>
    <rect x="618" y="270" width="132" height="340" rx="10" fill="url(#torre)" opacity="0.92"/>
    <!-- janelas bloco A -->
    <g fill="#0B6E59" opacity="0.85">
      <rect x="474" y="240" width="40" height="28" rx="4"/><rect x="540" y="240" width="40" height="28" rx="4"/>
      <rect x="474" y="292" width="40" height="28" rx="4"/><rect x="540" y="292" width="40" height="28" rx="4"/>
      <rect x="474" y="344" width="40" height="28" rx="4"/><rect x="540" y="344" width="40" height="28" rx="4"/>
      <rect x="474" y="396" width="40" height="28" rx="4"/><rect x="540" y="396" width="40" height="28" rx="4"/>
      <rect x="474" y="448" width="40" height="28" rx="4"/><rect x="540" y="448" width="40" height="28" rx="4"/>
      <rect x="474" y="500" width="40" height="28" rx="4"/><rect x="540" y="500" width="40" height="28" rx="4"/>
    </g>
    <!-- janelas bloco B -->
    <g fill="#0B6E59" opacity="0.7">
      <rect x="638" y="300" width="36" height="26" rx="4"/><rect x="694" y="300" width="36" height="26" rx="4"/>
      <rect x="638" y="350" width="36" height="26" rx="4"/><rect x="694" y="350" width="36" height="26" rx="4"/>
      <rect x="638" y="400" width="36" height="26" rx="4"/><rect x="694" y="400" width="36" height="26" rx="4"/>
      <rect x="638" y="450" width="36" height="26" rx="4"/><rect x="694" y="450" width="36" height="26" rx="4"/>
      <rect x="638" y="500" width="36" height="26" rx="4"/><rect x="694" y="500" width="36" height="26" rx="4"/>
    </g>
  </g>

  <!-- acácia: tronco e galhos -->
  <g fill="none" stroke="#3B2A1A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 612 C368 560 372 520 384 470" stroke-width="26"/>
    <path d="M384 470 C360 430 320 410 270 392" stroke-width="16"/>
    <path d="M384 470 C400 430 440 410 486 398" stroke-width="16"/>
    <path d="M380 500 C352 470 330 452 300 440" stroke-width="10"/>
  </g>
  <!-- acácia: copa achatada dourada -->
  <g>
    <ellipse cx="378" cy="372" rx="190" ry="58" fill="url(#copa)"/>
    <ellipse cx="300" cy="352" rx="96" ry="44" fill="#F6CE5A"/>
    <ellipse cx="458" cy="350" rx="104" ry="46" fill="#F6CE5A"/>
    <ellipse cx="380" cy="330" rx="110" ry="44" fill="#FADB78"/>
    <!-- florzinhas -->
    <g fill="#FFF3C4">
      <circle cx="262" cy="350" r="9"/><circle cx="318" cy="324" r="8"/><circle cx="372" cy="306" r="9"/>
      <circle cx="430" cy="318" r="8"/><circle cx="492" cy="338" r="9"/><circle cx="530" cy="368" r="7"/>
      <circle cx="232" cy="378" r="7"/><circle cx="410" cy="352" r="7"/><circle cx="344" cy="360" r="7"/>
    </g>
  </g>

  <!-- chão -->
  <path d="M190 612 Q512 586 834 612" fill="none" stroke="#F7F1E3" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- nome -->
  <text x="512" y="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="9" fill="#BFEDE1">RESIDENCIAL</text>
  <text x="512" y="772" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" fill="#F7F1E3">Jardim das Acácias</text>
</svg>
